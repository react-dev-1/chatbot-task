<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LMSYS Chat</title>
  <style>
    :root {
      --bg: #f7f7f8; --panel: #fff; --text: #1d1d1f; --muted: #6b6b73;
      --border: #e3e3e8; --user: #1f6feb; --user-text: #fff; --bot: #f0f0f3; --danger: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214; --panel: #1a1b1e; --text: #ececf1; --muted: #9a9aa3;
        --border: #2c2d31; --user: #2f81f7; --user-text: #fff; --bot: #24252a; --danger: #ef5350;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 16px; margin: 0; }
    #status { color: var(--muted); font-size: 13px; }
    #log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
    .assistant { align-self: flex-start; background: var(--bot); }
    .voice::before { content: "🎙 "; }
    .error { color: var(--danger); }
    .sources { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
    form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--border); }
    input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; }
    button { padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #call.active { background: var(--danger); color: #fff; border-color: var(--danger); }
    .note { color: var(--muted); font-size: 12px; text-align: center; margin: 0 0 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>LMSYS Chat</h1>
      <span id="status"></span>
      <button id="call" type="button" disabled>Start call</button>
    </header>
    <div id="log" aria-live="polite"></div>
    <p class="note">Answers are written by Claude using similar conversations from LMSYS-Chat-1M as reference. They may be inaccurate.</p>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Ask anything…" maxlength="1000" aria-label="Message">
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
